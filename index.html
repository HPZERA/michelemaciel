<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dra. Michele Maciel — Advogada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:         #0b1120;
      --surface:    #131e34;
      --gold:       #c8a84b;
      --gold-light: #dfc070;
      --white:      #ece8df;
      --muted:      #6b7591;
      --border:     rgba(200, 168, 75, 0.22);
    }

    body {
      background-color: var(--bg);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 20px 64px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* ── Foto de perfil ── */
    .avatar-wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    .avatar-inner {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .avatar-inner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* ── Linha decorativa ── */
    .line {
      width: 36px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }

    /* ── Cabeçalho ── */
    .header {
      text-align: center;
      margin-top: -8px;
    }

    .header .badge {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--border);
      padding: 4px 14px;
      border-radius: 2px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.15;
      letter-spacing: 0.2px;
      margin-bottom: 8px;
    }

    .header .subtitle {
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.6px;
    }

    /* ── Botões ── */
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 18px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.4px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      gap: 14px;
    }

    .btn:hover {
      background: #1b2d4f;
      border-color: var(--gold);
    }

    .btn:active {
      transform: scale(0.975);
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      background: rgba(200, 168, 75, 0.06);
    }

    .btn-text {
      flex: 1;
    }

    .btn-text .label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
    }

    .btn-text .desc {
      display: block;
      font-size: 11.5px;
      font-weight: 300;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-arrow {
      color: var(--gold);
      font-size: 14px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .btn-whatsapp {
      border-color: rgba(200, 168, 75, 0.45);
    }

    .btn-whatsapp .btn-icon {
      background: rgba(37, 211, 102, 0.08);
      border-color: rgba(37, 211, 102, 0.2);
    }

    /* ── Rodapé ── */
    .footer p {
      font-size: 11px;
      color: var(--muted);
      opacity: 0.45;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Foto de perfil -->
    <div class="avatar-wrap">
      <div class="avatar-inner">
        <img src="foto.png" alt="Dra. Michele Maciel" />

    <!-- Cabeçalho -->
    <div class="header">
      <span class="badge">Trabalhista &nbsp;|&nbsp; Família &nbsp;|&nbsp; Previdenciário</span>
      <h1>Dra. Michele Maciel</h1>
      <p class="subtitle">Advogada</p>

    <div class="line"></div>

    <!-- Botões -->
    <div class="buttons">

            <path fill="#fff" d="M35.2 28.5c-.5-.2-2.8-1.4-3.2-1.5-.4-.2-.7-.2-1 .2-.3.5-1.2 1.5-1.4 1.8-.3.3-.5.3-1 .1-.5-.2-2-.7-3.8-2.3-1.4-1.2-2.3-2.8-2.6-3.2-.3-.5 0-.7.2-1 .2-.2.5-.5.7-.8.2-.3.3-.5.5-.8.2-.3.1-.6 0-.8-.1-.2-1-2.5-1.4-3.4-.4-.9-.7-.8-1-.8h-.9c-.3 0-.8.1-1.2.6-.4.5-1.6 1.6-1.6 3.8s1.7 4.4 1.9 4.7c.2.3 3.3 5.1 8 7.1 1.1.5 2 .8 2.7 1 1.1.3 2.2.3 3 .2.9-.1 2.8-1.1 3.2-2.2.4-1.1.4-2 .3-2.2-.2-.2-.5-.3-1-.5z"/>

      <!-- Localização -->
      <a class="btn" href="https://maps.google.com/?q=Avenida+Mascarenhas+de+Moraes+695+centro+S%C3%A3o+Gabriel+RS" target="_blank" rel="noopener">
        <span class="btn-icon">📍</span>
        <span class="btn-text">
          <span class="label">Localização do Escritório</span>

        </span>
        <span class="btn-arrow">›</span>

      <a class="btn" href="mailto:michelemaciel922@gmail.com">
        <span class="btn-icon">✉️</span>
        <span class="btn-text">
          <span class="label">Contato por E-mail</span>
          <span class="desc">michelemaciel922@gmail.com</span>
        </span>
        <span class="btn-arrow">›</span>
      </a>

    </div>

    <div class="line"></div>

    <!-- Rodapé -->
    <div class="footer">
      <p>© 2025 Dra. Michele Maciel · Todos os direitos reservados</p>
    </div>

  </div>
</body>
</html>
